# Example earshot policy (SPEC §16). Copy to ./policy.yaml and edit. Secrets are $VAR indirections
# only — never inline (§10.6); the referenced env vars come from .env / the supervisor.
#
# Startup validation (§16.3) checks: surface creds present, one identity per venue, grants
# reference known tools, budgets parse, no cross-identity private-venue learning sources. An
# invalid policy fails `earshot start` loudly; an invalid live-reload keeps the last-known-good.

surface:
  kind: slack
  credentials:
    bot_token: $SLACK_BOT_TOKEN
    app_token: $SLACK_APP_TOKEN

operator_principals:
  - U_YOUR_OPERATOR_ID # Slack user IDs whose recurring/confirmation actions count as operator

trusted_bot_principals: [] # bot principals whose mentions count as addressed (default: none, §10.5)

default_dm_identity: eng # auto-bind newly-seen DMs to this identity (§7.2); omit to ignore unbound DMs

turns:
  interactive_timeout_ms: 120000
  interactive_token_ceiling: 100000
  stall_timeout_ms: 45000 # idle watchdog for resident turns
  max_concurrent_interactive: 4
  batch_debounce_ms: 2500 # §5.5 quiet window: a turn starts once the room's been quiet this long, so a burst lands as ONE batch (0 = off)
  batch_max_wait_ms: 10000 # sustained chatter can't hold a turn past this

executions:
  max_concurrent_per_identity: 2
  max_concurrent_global: 4
  max_turns: 40
  stall_timeout_ms: 420000 # workers may idle on slow db_read; 7min before stall kill
  max_attempts: 3

tasks:
  nudge_after_ms: 86400000 # 1 day
  park_after_ms: 172800000 # 2 days

budget:
  unit: USD
  timezone: America/New_York
  global_monthly_cap: 500
  reserve: 10 # usable after exhaustion only by steer/cancel/confirm/reply (§10.3)

models:
  low: {} # ear attention passes
  default: {} # resident wakes
  medium: {} # routine delegated tasks + memory distillation
  high: {} # deep triage / cross-thread synthesis

memory:
  core_char_budget: 8000 # always-on facts in AGENTS.md; keep small
  recent_char_budget: 2000 # staging pile; hitting this arms the distillation pass (§8.6)
  recent_max_age_days: 7 # under-budget stale recent still decays to archive at soul regen

identities:
  - id: eng
    persona: "You are the engineering team's assistant."
    venue_ids:
      - C0123456789 # channels/DMs this identity serves (Slack channel IDs)
      - C099YDUFQ9Z # example: prod alerts — tune venue_instructions below
    learning_sources: [] # read-only observation venues (memory distillation only, §7.3)
    budget:
      monthly_cap: 200
      per_task_cap: 25
    grants:
      # Workers need the same tools the resident uses for triage. Built-ins (reply, task_*, memory_*, search) are always on.
      - tool: read_channel
        preauthorized_action_classes: []
      - tool: read_thread
        preauthorized_action_classes: []
      - tool: db_read
        preauthorized_action_classes: []
    ambient:
      event_debounce_ms: 30000 # quiet window before ear judges a burst (45s for very chatty venues)
    venue_instructions:
      C099YDUFQ9Z: >-
        Prod alert feed; you are the only triager here. Ticket is where triage lands (real receipts
        from ops tools, not channel-history guesses). Every alert is worth independent investigation —
        do not assume another person's ownership, a prior false-positive, or similarity to an older
        alert covers a new one; inspect each and respond with the finding. Narrow exception: nightly
        VRT alert/workflow posts are dead signal unless the operator says they are revived.
        Cross-thread synthesis belongs in a background task, not inline.
